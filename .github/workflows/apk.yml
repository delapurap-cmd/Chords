name: APK Android (Acordes)

# Compila el APK del reconocedor de acordes.
#
# Existe por una razón concreta: la página funciona, pero dentro de un artifact
# el selector de ficheros no llega a abrirse, así que no hay manera de darle un
# MP3 de verdad. En un APK sí — y sin un MP3 de verdad no se puede decir qué tal
# reconoce, sólo qué tal reconoce una progresión sintetizada.
#
# El proyecto Android NO se guarda en el repositorio: lo genera `cap add android`
# en cada compilación a partir de `movil/`. Son 54 ficheros generados que nadie
# va a editar a mano y que sólo sirven para quedarse desfasados.
#
# Además del artefacto —que sólo se baja con sesión iniciada— deja una
# publicación con enlace fijo al último APK.
on:
  workflow_dispatch:
  push:
    paths:
      - 'web/reconocedor.html'
      - 'movil/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: acordes-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        working-directory: movil
        run: npm install --no-audit --no-fund

      - name: Preparar la web y generar el proyecto Android
        working-directory: movil
        run: |
          set -euo pipefail
          node build-www.mjs
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: movil/android
        run: |
          chmod +x gradlew
          # sin consola interactiva: cualquier pregunta falla en vez de colgarse
          ./gradlew assembleDebug --no-daemon --console=plain < /dev/null

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mtm-acordes-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Dejar el APK descargable por enlace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp movil/android/app/build/outputs/apk/debug/app-debug.apk mtm-acordes.apk
          gh release delete acordes-latest --yes --cleanup-tag || true
          gh release create acordes-latest mtm-acordes.apk \
            --title "MTM Acordes (último APK)" \
            --notes "APK del commit ${{ github.sha }}, rama ${{ github.ref_name }}."
